
# compression
encode zstd gzip

# return denied on 403 status
respond /forbidden 403

# http custom response header
header {
    # prevent some browsers from MIME-sniffing a response away from the declared Content-Type
    X-Content-Type-Options "nosniff"

    # disallow the site to be rendered within a frame (clickjacking protection)
    X-Frame-Options "DENY"

    # referrer policy
    Referrer-Policy "no-referrer"

    # remove server field
    -Server

    # strip Caddy's malformed `Via: 0.0 Caddy` header — Caddy's FastCGI gateway
    # synthesises an empty HTTP version on FastCGI responses, producing a Via
    # value with version "0.0" that Chrome's HTTP/2 stack rejects on 304
    # responses (ERR_HTTP2_PROTOCOL_ERROR on conditional GETs / regular CMD+R
    # refresh, while CMD+SHIFT+R works). Strip it everywhere.
    -Via

    # strip the HTTP/1.0 `Pragma: no-cache` relic that PHP's session_start()
    # auto-emits via session_cache_limiter; obsolete and noisy.
    -Pragma

    # disable selective browser features and APIs
    Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()"

    # content security policy — tightened 2026-04-09 (passes 1-2).
    # 'unsafe-eval' remains for Snap.svg (Function() constructor);
    # 'unsafe-inline' remains for inlined critical CSS <style> tag.
    Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
}

# cache: long-lived for static assets, short for everything else
@static {
    path /assets/* /user/themes/* /user/pages/*/images/*
}
header @static Cache-Control "max-age=31536000, immutable"
header @static Expires "Thu, 31 Dec 2037 23:55:55 GMT"
@notStatic {
    not path /assets/* /user/themes/* /user/pages/*/images/*
}
# 5-min private browser cache with stale-while-revalidate; `private` keeps
# the per-user session cookie out of any shared cache.
header @notStatic >Cache-Control "private, max-age=300, must-revalidate, stale-while-revalidate=86400"
header @notStatic -Expires

# tls config — Caddy defaults are Mozilla-Intermediate equivalent; the previous
# block pinned key_type/curves/ciphers and broke HTTP/3. Keep it minimal.
tls gregory@gregorykelleher.com

# security config
#
# Caddy v2 named matchers. The previous version used v1-style
# `rewrite /(\.git|...)/.* /403` rules: in Caddy v2 a bare `/`-prefixed token
# is a *path* matcher (prefix + `*` glob), NOT a regex, so the parentheses,
# pipes and `.*` were matched literally and the rules never fired — every
# path below was served with HTTP 200. Rewritten with `path_regexp` matchers
# and `respond`, which Caddy orders ahead of file_server/php_fastcgi so the
# denial wins. Verified: each path below returns 403, real assets 200, and
# /.well-known/* is left reachable so ACME cert renewal keeps working.

# deny all direct access for these folders (note: dir is `backup`, not backups)
@denied_folders path_regexp ^/(\.git|cache|bin|logs|backup|backups|tests)/
respond @denied_folders 403

# deny all dotfiles/dot-directories (e.g. .git, .env, .photo-originals),
# except ACME's /.well-known used for certificate issuance/renewal
@dotfiles {
	path_regexp ^/\.
	not path /.well-known/*
}
respond @dotfiles 403

# deny running/serving scripts and data inside core system folders
@system_scripts path_regexp ^/(system|vendor)/.*\.(txt|xml|md|html|htm|shtml|shtm|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$
respond @system_scripts 403

# deny running/serving scripts and data inside user folder
@user_scripts path_regexp ^/user/.*\.(txt|md|yaml|yml|php|php2|php3|php4|php5|phar|phtml|pl|py|cgi|twig|sh|bat)$
respond @user_scripts 403

# deny access to specific files in the root folder
@root_files path_regexp ^/(LICENSE\.txt|composer\.lock|composer\.json|nginx\.conf|web\.config|htaccess\.txt|\.htaccess)$
respond @root_files 403
## End - Security

# global rewrite should come last.
try_files {path} {path}/ /index.php?_url={uri}&{query}
